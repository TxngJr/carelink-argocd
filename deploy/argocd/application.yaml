apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: carelink
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/TxngJr/carelink-argocd.git
    targetRevision: main
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: carelink
  syncPolicy:
    automated:
      # Disabled only for the one-time rotation away from the legacy
      # in-repository Secret. Restore this to true after the new Secret is live.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
