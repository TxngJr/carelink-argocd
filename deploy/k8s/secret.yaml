apiVersion: v1
kind: Secret
metadata:
  name: carelink-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    carelink.dev/security-scope: public-demo-only
type: Opaque
stringData:
  # Public demo credentials: intentionally committed so Argo CD can deploy
  # this sandbox without an external secret provider. Never reuse these
  # values for real patient data or a production environment.
  JWT_SECRET: carelink-public-demo-only-jwt-signing-key-2026-do-not-use-with-real-data
  DEVELOPMENT_LOGIN_PASSWORD: password123
