apiVersion: v1
kind: Service
metadata:
  name: carelink
spec:
  selector:
    app.kubernetes.io/name: carelink
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carelink
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: carelink
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: carelink
        app.kubernetes.io/component: app
      annotations:
        # Increment when changing values in secret.yaml so existing pods pick
        # up the new environment variables during the next Argo CD sync.
        carelink.dev/secret-revision: public-demo-v2-atlas
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: carelink
              app.kubernetes.io/component: app
      containers:
        - name: carelink
          image: carelink-app
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: carelink-config
            - secretRef:
                name: carelink-secrets
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  # This secret is intentionally not stored in this public Git
                  # repository. Create it in the carelink namespace before sync.
                  name: carelink-atlas
                  key: MONGO_URI
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
