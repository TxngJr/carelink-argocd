apiVersion: v1
kind: ConfigMap
metadata:
  name: carelink-config
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  # MONGO_URI is intentionally kept out of this public ConfigMap. The
  # Deployment reads it from the carelink-atlas Secret instead.
  DB_NAME: carelink
  APP_ENV: public_demo
  NEXT_PUBLIC_APP_NAME: CareLink
  DEMO_AUTH_RATE: "10"
  DEMO_WRITE_RATE: "60"
  INFUSION_MAX_CHAIRS: "100"
  TZ: Asia/Bangkok
