apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: carelink
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: carelink
      app.kubernetes.io/component: app
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: carelink-app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: carelink
      app.kubernetes.io/component: app
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - { protocol: TCP, port: 3000 }
  egress:
    # MongoDB Atlas SRV/TXT discovery is resolved through cluster DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Atlas nodes are external to the Kubernetes cluster and their IPs can
    # change, so allow outbound MongoDB traffic on the database port.
    - ports:
        - { protocol: TCP, port: 27017 }
