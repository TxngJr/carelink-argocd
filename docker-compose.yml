services:
  mongo:
    image: mongo:7
    container_name: carelink_mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongo:27017\"}]}).ok }' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: carelink_backend
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://mongo:27017/?replicaSet=rs0
      - DB_NAME=carelink
      - JWT_SECRET=carelink_dev_secret
      - APP_ENV=development
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build: ./web
    container_name: carelink_web
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data:
