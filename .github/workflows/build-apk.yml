name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: care-link
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20.19
          cache: npm
          cache-dependency-path: care-link/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: 22.0.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build installable APK
        env:
          EXPO_PUBLIC_API_URL: https://carelink.denmannsolutions.com
        run: eas build --platform android --profile production-apk --non-interactive --wait
