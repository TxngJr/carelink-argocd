name: Build CareLink and update Argo CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: carelink-release-${{ github.ref }}
  cancel-in-progress: true

env:
  # Reuse the existing GHCR package that the cluster has already pulled from.
  # The package now contains the unified Next.js application image.
  IMAGE: ghcr.io/txngjr/carelink-argocd-web

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  build:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create immutable image tag
        id: release
        shell: bash
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.release.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifest:
    if: ${{ github.event_name != 'pull_request' && needs.build.result == 'success' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Write released image and SHA tag
        shell: bash
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          sed -i -E "s#newName: ghcr.io/txngjr/[^[:space:]]+#newName: ${IMAGE}#g" deploy/k8s/kustomization.yaml
          sed -i -E "s/newTag: sha-[0-9a-f]+/newTag: ${IMAGE_TAG}/g" deploy/k8s/kustomization.yaml
      - name: Commit GitOps release
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/kustomization.yaml
          git commit -m "chore(deploy): release sha-${GITHUB_SHA::7} [skip ci]"
          git push