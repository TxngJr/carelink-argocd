name: Build images and update Argo CD

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - web/**
      - .github/workflows/build-deploy.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: carelink-release
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/txngjr/carelink-argocd

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test backend
        working-directory: backend
        run: |
          go test ./...
          go vet ./...

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test frontend
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - backend
          - web
    steps:
      - uses: actions/checkout@v7

      - name: Create immutable image tag
        id: release
        shell: bash
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile${{ matrix.component == 'web' && '.prod' || '' }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ steps.release.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  update-manifests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Write SHA image tags
        shell: bash
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          sed -i -E "s/newTag: sha-[0-9a-f]+/newTag: ${IMAGE_TAG}/g" deploy/k8s/kustomization.yaml

      - name: Commit GitOps release
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/kustomization.yaml
          git commit -m "chore(deploy): release sha-${GITHUB_SHA::7} [skip ci]"
          git push
